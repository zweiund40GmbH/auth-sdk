# Publishes the Rust SDK to crates.io when `version` in rust/Cargo.toml changes on main, then sets the
# fixed tag `rust-vX.Y.Z` (never moved). Idempotent: an already published version is not uploaded again,
# an existing tag ends the run. Tags pushed with GITHUB_TOKEN start no other workflows, so publishing and
# tagging happen in this one workflow.
#
# Two jobs with separate permissions: `check` builds and tests (dependency build scripts run there) with
# read-only rights and verifies the package; `publish` builds nothing (`cargo publish --no-verify`, so no
# build scripts run) and pushes the tag (contents: write).
#
# Secret: CARGO_REGISTRY_TOKEN – crates.io API token with the scopes publish-new and publish-update,
# limited to the crate z40-auth once it exists.
name: Release Rust

on:
  push:
    branches: [main]
    paths: [rust/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rust
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Qualitätstor + Paket
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      done: ${{ steps.v.outputs.done }}
      channel: ${{ steps.toolchain.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version lesen
        id: v
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p}' rust/Cargo.toml | head -n1)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rust/Cargo.toml: version muss SemVer X.Y.Z sein, ist aber '${version}'."
            exit 1
          fi
          tag="rust-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} existiert bereits – nichts zu tun." >> "$GITHUB_STEP_SUMMARY"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        if: steps.v.outputs.done != 'true'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: extractions/setup-just@v4
        if: steps.v.outputs.done != 'true'

      - name: Qualitätstor
        if: steps.v.outputs.done != 'true'
        run: just lines rust-check

      # The crate must build exactly as it would be uploaded.
      - name: Paket prüfen
        if: steps.v.outputs.done != 'true'
        run: just rust-package

  publish:
    name: crates.io + Tag
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.check.outputs.channel }}

      - name: Auf crates.io veröffentlichen
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -A 'zweiund40GmbH/auth-sdk release' \
            "https://crates.io/api/v1/crates/z40-auth/${VERSION}")"
          if [ "$status" = "200" ]; then
            echo "z40-auth ${VERSION} ist bereits veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
              echo "::warning::Secret CARGO_REGISTRY_TOKEN fehlt – nichts veröffentlicht, kein Tag gesetzt. Secret anlegen und den Workflow erneut starten."
              echo "skip=true" >> "$GITHUB_ENV"
              exit 0
            fi
            # Verified (built and tested) in the check job; here nothing is compiled.
            (cd rust && cargo publish --locked --no-verify)
            echo "z40-auth ${VERSION} veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tag setzen
        if: env.skip != 'true'
        env:
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "z40-auth ${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "Tag ${TAG} gesetzt." >> "$GITHUB_STEP_SUMMARY"
