# Publishes the Next.js SDK to npm when `version` in js/package.json changes on main, then sets the
# fixed tag `js-vX.Y.Z` (never moved). Idempotent: an already published version is not uploaded again,
# an existing tag ends the run. Tags pushed with GITHUB_TOKEN start no other workflows, so publishing and
# tagging happen in this one workflow.
#
# Two jobs with separate permissions: `check` installs dependencies, runs the quality gate and packs the
# tarball with read-only rights; `publish` runs no project code – it uploads exactly that tarball with npm
# provenance (id-token: write) and pushes the tag (contents: write).
#
# Authentication: npm Trusted Publishing (OIDC) – no long-lived token. Precondition (set once on npmjs.com
# by a maintainer): package @zweiund40gmbh/auth-next -> Settings -> Trusted Publisher -> GitHub Actions with
# organization `zweiund40GmbH`, repository `auth-sdk`, workflow filename `release-js.yml`, environment `release`.
# Runs only on main (also for workflow_dispatch). Requires npm CLI >= 11.5.1 and Node >= 22.14 (documented by npm); the publish job upgrades npm explicitly
# because the npm bundled with the Node version of .nvmrc may be older. See README, section "Versionen und
# Veröffentlichung".
name: Release JS

on:
  push:
    branches: [main]
    paths: [js/package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-js
  cancel-in-progress: false

jobs:
  check:
    name: Qualitätstor + Paket
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      done: ${{ steps.v.outputs.done }}
    steps:
      - name: Nur von main veröffentlichen
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Veröffentlicht wird nur von main (gestartet von ${REF}). Workflow auf main starten."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version lesen
        id: v
        run: |
          version="$(node -p 'require("./js/package.json").version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::js/package.json: version muss SemVer X.Y.Z sein, ist aber '${version}'."
            exit 1
          fi
          tag="js-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} existiert bereits – nichts zu tun." >> "$GITHUB_STEP_SUMMARY"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.v.outputs.done != 'true'
        with:
          node-version-file: .nvmrc

      - name: Abhängigkeiten installieren
        if: steps.v.outputs.done != 'true'
        run: |
          corepack enable
          yarn install --immutable

      - uses: extractions/setup-just@v4
        if: steps.v.outputs.done != 'true'

      - name: Qualitätstor
        if: steps.v.outputs.done != 'true'
        run: just js-check

      - name: Paket bauen
        if: steps.v.outputs.done != 'true'
        run: |
          mkdir -p npm-package
          (cd js && npm pack --pack-destination ../npm-package)

      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.done != 'true'
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: npm + Tag
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 (the npm shipped with Node may be older). Pinned to an exact
      # version on purpose (this job holds id-token and contents write); raise it by hand.
      - name: npm mit Trusted-Publishing-Unterstützung bereitstellen
        run: |
          npm install --global "npm@11.21.1"
          npm --version

      - name: Auf npm veröffentlichen
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if npm view "@zweiund40gmbh/auth-next@${VERSION}" version >/dev/null 2>&1; then
            echo "@zweiund40gmbh/auth-next ${VERSION} ist bereits veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
          else
            tarball="./npm-package/zweiund40gmbh-auth-next-${VERSION}.tgz"
            npm publish "$tarball" --provenance --access public --ignore-scripts
            echo "@zweiund40gmbh/auth-next ${VERSION} veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tag setzen
        env:
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "@zweiund40gmbh/auth-next ${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "Tag ${TAG} gesetzt." >> "$GITHUB_STEP_SUMMARY"
